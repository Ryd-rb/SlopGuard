[package]
name = "slophawk-foreground-checks"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Foreground check, observation, retest and review orchestration"
license = "MIT"
publish = false

[lib]
name = "slophawk_foreground_checks"
path = "src/lib.rs"

[[bin]]
name = "slophawk-foreground-checks"
path = "src/main.rs"

[dependencies]
slophawk-worker-scope = { path = "../../runtime/worker-scope" }
slophawk-probe-replay = { path = "../../checkers/probe-replay" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
sha2 = "=0.10.9"
uuid = { version = "1.0", features = ["v4"] }

[package]
name = "slophawk-scalar-foreground"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace]

[lib]
name = "slophawk_scalar_foreground"
path = "src/lib.rs"

[[bin]]
name = "scalar-paths-foreground"
path = "src/main.rs"

[dependencies]
slophawk-worker-scope = { path = "../../runtime/worker-scope" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
slophawk-scalar-paths = { path = "../../checkers/scalar-paths" }

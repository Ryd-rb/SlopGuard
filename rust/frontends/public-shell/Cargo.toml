[package]
name = "slophawk-public-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false
description = "Native compatibility entry point for the published SlopHawk daemon and MCP tools"

[workspace]

[lib]
name = "slophawk_public_shell"
path = "src/lib.rs"

[[bin]]
name = "slophawk-native"
path = "src/main.rs"

[dependencies]
slophawk-foreground-checks = { path = "../../foreground/checks" }
slophawk-native-checks = { path = "../../native-checks" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

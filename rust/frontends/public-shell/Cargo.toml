[package]
name = "slophawk-public-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false
description = "Native compatibility entry point for the published SlopHawk daemon and MCP tools"

[workspace]

[lib]
name = "slophawk_public_shell"
path = "src/lib.rs"

[[bin]]
name = "slophawk-native"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
getrandom = "=0.4.3"
hmac = "=0.12.1"
slophawk-worker-scope = { path = '../../runtime/worker-scope' }
slophawk-native-coordinator = { path = "../../native-coordinator" }
slophawk-foreground-checks = { path = "../../foreground/checks" }
slophawk-scalar-foreground = { path = "../../foreground/paths" }
slophawk-contracts-probes = { path = "../../foreground/contracts-probes" }
slophawk-native-checks = { path = "../../native-checks" }
slophawk-language-execution = { path = "../../workers/language-execution" }
slophawk-python-project-context = { path = "../../project-context/python" }
slophawk-rust-project-context = { path = "../../project-context/rust" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

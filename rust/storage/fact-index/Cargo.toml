[package]
name = "slophawk-fact-index"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Ryd-rb/SlopHawk"
description = "Revision-fenced, bounded SQLite document facts and SG-10 clone postings"

[lib]
name = "slophawk_fact_index"
path = "src/lib.rs"

[[bin]]
name = "fact-index"
path = "src/main.rs"

[dependencies]
# Exact versions match the pinned FluxR project-context lock where available.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
# Deliberate independent native pin, NOT the NuGet e_sqlite3 2.1.13 native asset.
# 0.37.0's libsqlite3-sys 0.35.0 bundles SQLite 3.50.2 (public domain).
# Owner regenerates this crate's lock and verifies target artifacts/digests.
rusqlite = { version = "=0.37.0", features = ["bundled"] }

[dev-dependencies]
slophawk-clone-index = { path = "../../checkers/clone-index" }

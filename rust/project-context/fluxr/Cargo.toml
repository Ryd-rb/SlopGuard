[package]
name = "slophawk-fluxr-checked-context"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false
description = "Explicit FluxR checked-module admission, supervised scalar test and replay receipts"

[lib]
name = "slophawk_fluxr_checked_context"
path = "src/lib.rs"

[[bin]]
name = "slophawk-fluxr-checked-worker"
path = "src/bin/checked-worker.rs"

[dependencies]
fluxr = { git = "https://github.com/Ryd-rb/FluxR-lang", rev = "e089fa301668c0d28821f72b08f6e4086a06ef27", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
slophawk-fluxr-provider = { path = "../../providers/fluxr" }
slophawk-probe-replay = { path = "../../checkers/probe-replay" }

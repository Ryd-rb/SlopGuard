[package]
name = "slophawk-csharp-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

# Reuse versions present in pinned migration crate lockfiles. The owner generates
# this NEW standalone crate's lockfile during integration; no lock is fabricated.
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

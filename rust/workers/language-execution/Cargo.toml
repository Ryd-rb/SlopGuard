[package]
name = "slophawk-language-execution"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace]

[[bin]]
name = "slophawk-language-worker"
path = "src/bin/language-worker.rs"

[dependencies]
slophawk-worker-scope = { path = "../../runtime/worker-scope" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
slophawk-python-project-context = { path = "../../project-context/python" }
slophawk-rust-project-context = { path = "../../project-context/rust" }
slophawk-fluxr-checked-context = { path = "../../project-context/fluxr" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading"] }

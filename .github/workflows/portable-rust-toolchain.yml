name: Prepare portable Rust Linux x64 packet

# Explicitly dispatched. The existing .NET workflow, default build and engine stay unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-rust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.404
      - name: Package pinned source, Rust and all locked Cargo graphs
        env:
          SOURCE_COMMIT: a367ef58076f7e29d2ae475a3b593daad04c4998
          SOURCE_TREE: fa4f03394ea061818423a1530831f6868942a94d
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          set -euo pipefail
          umask 022
          [[ "$(dotnet --version)" == 10.0.404 ]]
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          [[ "$(git rev-parse "${SOURCE_COMMIT}^{tree}")" == "$SOURCE_TREE" ]]
          git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/main
          scratch="$RUNNER_TEMP/slophawk-rust-packet"
          [[ ! -e "$scratch" ]]
          mkdir -p "$scratch" "$scratch/dotnet-cli" "$scratch/online-cargo-home" "$scratch/online-target"
          export DOTNET_CLI_HOME="$scratch/dotnet-cli"
          export CARGO_HOME="$scratch/online-cargo-home"
          export CARGO_TARGET_DIR="$scratch/online-target"
          export CARGO_NET_OFFLINE=false
          tool=(dotnet run --project tools/SlopHawk.RustToolchain --)
          "${tool[@]}" self-test "$scratch/self-test-portable"
          "${tool[@]}" self-test-unix "$scratch/self-test-unix"
          "${tool[@]}" pack-source "$GITHUB_WORKSPACE" "$SOURCE_COMMIT" "$scratch/packet"
          "${tool[@]}" verify-source "$scratch/packet" "$scratch/prepared"
          "${tool[@]}" fetch-rust "$scratch/packet"

          # The combined official distribution's SHA-256 is pinned and checked by fetch-rust.
          mkdir -p "$scratch/rust-expanded" "$scratch/rust-prefix"
          tar -tJf "$scratch/packet/rust-1.99.1-x86_64-unknown-linux-gnu.tar.xz" > "$scratch/rust-members.txt"
          [[ -s "$scratch/rust-members.txt" ]]
          tar -xJf "$scratch/packet/rust-1.99.1-x86_64-unknown-linux-gnu.tar.xz" \
            -C "$scratch/rust-expanded" --no-same-owner
          "$scratch/rust-expanded/rust-1.99.1-x86_64-unknown-linux-gnu/install.sh" \
            --prefix="$scratch/rust-prefix" --disable-ldconfig
          export PATH="$scratch/rust-prefix/bin:$PATH"
          [[ "$(command -v rustc)" == "$scratch/rust-prefix/bin/rustc" ]]
          [[ "$(command -v cargo)" == "$scratch/rust-prefix/bin/cargo" ]]
          rustc -Vv
          cargo -V
          cargo fmt --version
          cargo clippy --version
          [[ "$(rustc -V | awk '{print $2}')" == 1.99.1 ]]
          [[ "$(cargo -V | awk '{print $2}')" == 1.99.1 ]]

          # Lock-containing manifests define independent package/workspace roots.
          # The alpha/beta fixture members intentionally have NO adjacent lock.
          cd "$scratch/prepared/checkout"
          mapfile -d '' locks < <(find rust -type f -name Cargo.lock -print0 | sort -z)
          [[ "${#locks[@]}" -eq 13 ]]
          manifests=()
          for lock in "${locks[@]}"; do
            manifest="${lock%Cargo.lock}Cargo.toml"
            [[ -f "$manifest" ]]
            manifests+=("$manifest")
          done
          vendor_args=(--locked --versioned-dirs --manifest-path "${manifests[0]}")
          for manifest in "${manifests[@]:1}"; do
            vendor_args+=(--sync "$manifest")
          done
          cargo vendor "${vendor_args[@]}" "$scratch/vendor" > "$scratch/cargo-vendor.toml"
          cd "$GITHUB_WORKSPACE"
          "${tool[@]}" pack-vendor "$scratch/packet" "$scratch/vendor" "$scratch/cargo-vendor.toml"
          "${tool[@]}" verify "$scratch/packet" "$scratch/verified"

          # Only the newly reconstructed sources, vendored inputs and fresh Cargo home
          # take part in this offline gate. No lockfile updates or host caches allowed.
          export CARGO_HOME="$scratch/verified/cargo-home"
          export CARGO_TARGET_DIR="$scratch/offline-target"
          export CARGO_NET_OFFLINE=true
          mkdir -p "$CARGO_TARGET_DIR"
          cd "$scratch/verified/checkout"
          for manifest in "${manifests[@]}"; do
            cargo metadata --manifest-path "$manifest" --locked --offline --format-version 1 > /dev/null
            cargo fmt --all --manifest-path "$manifest" -- --check
            cargo build --manifest-path "$manifest" --locked --offline --all-targets
            cargo test --manifest-path "$manifest" --locked --offline --all-targets
            cargo clippy --manifest-path "$manifest" --locked --offline --all-targets -- -D warnings
          done
          echo "Offline locked metadata/build/test/clippy passed for ${#manifests[@]} roots" >> "$GITHUB_STEP_SUMMARY"

          # Cargo's --offline switch and OS-enforced network denial are *distinct* gates.
          # No namespace privilege on a hosted runner is an explicit unsupported status.
          if command -v unshare >/dev/null && unshare -Urn true 2>/dev/null; then
            if unshare -Urn -- cargo metadata --manifest-path "${manifests[0]}" \
                --locked --offline --format-version 1 > /dev/null; then
              echo 'OS network denial: PASS (user+network namespace, first lock root metadata)' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'OS network denial: FAIL (namespace available, bounded metadata failed)' >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          else
            echo 'OS network denial: UNSUPPORTED (unprivileged namespace unavailable)' >> "$GITHUB_STEP_SUMMARY"
          fi
          dotnet publish "$GITHUB_WORKSPACE/tools/SlopHawk.RustToolchain" \
            --configuration Release -p:UseAppHost=false -p:NuGetAudit=false \
            --output "$scratch/verifier"
          {
            echo "Source commit: $SOURCE_COMMIT"
            echo "Source tree: $SOURCE_TREE"
            echo "### Inner package file SHA-256"
            sha256sum "$scratch/packet/"* | sed 's|.*/packet/||'
            echo "### Standalone verifier SHA-256 (built from workflow HEAD)"
            sha256sum "$scratch/verifier/"* | sed 's|.*/verifier/||'
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'PACKET=%s\nSOURCE_COMMIT=%s\nVERIFIER=%s\n' "$scratch/packet" "$SOURCE_COMMIT" "$scratch/verifier" >> "$GITHUB_ENV"
      - name: Upload source receipt and immutable archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: slophawk-rust-source-a367ef58076f7e29d2ae475a3b593daad04c4998
          path: |
            ${{ env.PACKET }}/source.json
            ${{ env.PACKET }}/slophawk-source.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload pinned Rust 1.99.1 archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: slophawk-rust-1.99.1-linux-x64-a367ef58076f7e29d2ae475a3b593daad04c4998
          path: |
            ${{ env.PACKET }}/rust.json
            ${{ env.PACKET }}/rust-1.99.1-x86_64-unknown-linux-gnu.tar.xz
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload complete Cargo vendor and replacement config
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: slophawk-cargo-vendor-a367ef58076f7e29d2ae475a3b593daad04c4998
          path: |
            ${{ env.PACKET }}/vendor.json
            ${{ env.PACKET }}/cargo-vendor.toml
            ${{ env.PACKET }}/slophawk-cargo-vendor.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload standalone .NET 10 receipt verifier
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: slophawk-rust-verifier-a367ef58076f7e29d2ae475a3b593daad04c4998
          path: |
            ${{ env.VERIFIER }}/SlopHawk.RustToolchain.dll
            ${{ env.VERIFIER }}/SlopHawk.RustToolchain.deps.json
            ${{ env.VERIFIER }}/SlopHawk.RustToolchain.runtimeconfig.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  windows-source-fixture:
    # This never installs or executes the Linux-only Rust distribution. It proves
    # the portable source-only fixture does not unconditionally chmod or symlink.
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.404
      - name: Portable source fixture with CRLF-producing Git settings
        shell: pwsh
        run: |
          dotnet run --project tools/SlopHawk.RustToolchain -- self-test "$env:RUNNER_TEMP/voda-portable-windows"

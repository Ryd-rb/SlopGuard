name: Rust migration qualification

on:
  workflow_dispatch:
  push:
    branches: [voda-linux-validation]

permissions:
  contents: read

jobs:
  language-exchanges:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.404
      - name: Start an authenticated systemd user manager
        shell: bash
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          test -f /sys/fs/cgroup/cgroup.controllers
          for attempt in $(seq 1 20); do
            if systemctl --user show-environment >/dev/null 2>&1; then break; fi
            sleep 1
          done
          systemctl --user show-environment >/dev/null
          systemd-run --user --wait --quiet --pipe -- /usr/bin/true
      - name: Build pinned Rust workers
        id: workers
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/voda-target"
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 build --locked --manifest-path rust/project-context/fluxr/Cargo.toml
          cargo +1.99.1 test --locked --manifest-path rust/workers/language-execution/Cargo.toml --no-run
          cargo +1.99.1 test --locked --manifest-path rust/native-coordinator/Cargo.toml --no-run
          echo "VODA_FLUXR_WORKER_BIN=$CARGO_TARGET_DIR/debug/slophawk-fluxr-checked-worker" >> "$GITHUB_ENV"
          echo "VODA_CARGO_BIN=$(rustup which --toolchain 1.99.1 cargo)" >> "$GITHUB_ENV"
          echo "VODA_RUSTC_BIN=$(rustup which --toolchain 1.99.1 rustc)" >> "$GITHUB_ENV"
          echo "VODA_RUSTDOC_BIN=$(rustup which --toolchain 1.99.1 rustdoc)" >> "$GITHUB_ENV"
      - name: Prepare pinned pytest and report plugin
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv --copies "$RUNNER_TEMP/voda-python"
          py="$RUNNER_TEMP/voda-python/bin/python3"
          mkdir "$RUNNER_TEMP/voda-wheelhouse"
          "$py" -m pip download --only-binary=:all: --dest "$RUNNER_TEMP/voda-wheelhouse" pytest==9.0.2 pytest-json-report==1.5.0 pytest-metadata==3.1.1
          "$py" -m pip install --no-index --find-links "$RUNNER_TEMP/voda-wheelhouse" pytest==9.0.2 pytest-json-report==1.5.0 pytest-metadata==3.1.1
          echo "VODA_PYTHON_BIN=$py" >> "$GITHUB_ENV"
          echo "VODA_PYTEST_SHA256=$(sha256sum "$RUNNER_TEMP"/voda-wheelhouse/pytest-*.whl | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          echo "VODA_PLUGIN_SHA256=$(sha256sum "$RUNNER_TEMP"/voda-wheelhouse/pytest_json_report-*.whl | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          echo "VODA_EFFECTIVE_PYTEST_CONFIG_SHA256=$(printf '%s' 'pytest-9.0.2;pytest-json-report-1.5.0;fixture-testpaths=tests;autoload=off' | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Run real language worker exchanges
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_NET_OFFLINE=true
          export SLOPHAWK_SCOPE_DIAGNOSTICS=1
          cargo +1.99.1 test --locked --offline --manifest-path rust/runtime/worker-scope/Cargo.toml
          cargo +1.99.1 test --locked --offline --manifest-path rust/workers/language-execution/Cargo.toml
          cargo +1.99.1 test --locked --offline --manifest-path rust/workers/language-execution/Cargo.toml --test real_workers -- --ignored --nocapture --test-threads=1
      - name: Exercise the coordinator and recover an interrupted live worker
        shell: bash
        run: |
          set -euo pipefail
          export SLOPHAWK_LIVE_NATIVE_SCOPE=1
          cargo +1.99.1 test --locked --offline --manifest-path rust/native-coordinator/Cargo.toml -- --test-threads=1
      - name: Run the four-language checker suite with an actual Roslyn worker
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/voda-dotnet"
          dotnet build src/SlopHawk.Providers.CSharp.Worker/SlopHawk.Providers.CSharp.Worker.csproj --artifacts-path "$artifacts"
          export VARO_DOTNET="$(readlink -f "$(command -v dotnet)")"
          export VARO_WORKER_DLL="$artifacts/bin/SlopHawk.Providers.CSharp.Worker/debug/SlopHawk.Providers.CSharp.Worker.dll"
          export VARO_REFERENCE_PACK="$(dirname "$VARO_DOTNET")/packs/Microsoft.NETCore.App.Ref/10.0.0/ref/net10.0"
          if ! test -f "$VARO_REFERENCE_PACK/System.Runtime.dll"; then
            export VARO_REFERENCE_PACK="$(find "$(dirname "$VARO_DOTNET")/packs/Microsoft.NETCore.App.Ref" -path '*/ref/net10.0' -type d | sort -V | tail -n 1)"
          fi
          test -f "$VARO_REFERENCE_PACK/System.Runtime.dll"
          export VARO_REQUIRE_REAL_WORKER=1 VODA_TEST_SYSTEMD_SCOPE=1
          cargo +1.99.1 test --locked --manifest-path rust/native-checks/Cargo.toml -- --test-threads=1
      - name: Transfer, update and return durable state with the Rust peer
        if: ${{ !cancelled() && steps.workers.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/voda-dotnet"
          cargo +1.99.1 build --locked --manifest-path rust/frontends/public-shell/Cargo.toml
          dotnet build tests/fixtures/native-engine/ControlledPeer.csproj --artifacts-path "$artifacts"
          export SLOPHAWK_NATIVE_MIGRATION_BINARY="$CARGO_TARGET_DIR/debug/slophawk-native"
          export SLOPHAWK_NATIVE_TEST_PEER_BINARY="$artifacts/bin/ControlledPeer/debug/slophawk-controlled-migration-peer"
          test -x "$SLOPHAWK_NATIVE_TEST_PEER_BINARY"
          dotnet test SlopHawk.slnx --artifacts-path "$artifacts" --logger 'console;verbosity=normal'
      - name: Reject incomplete release evidence
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/voda-dotnet"
          dotnet build tools/SlopHawk.RustMigrationQualification/SlopHawk.RustMigrationQualification.csproj --artifacts-path "$artifacts"
          status=0
          dotnet "$artifacts/bin/SlopHawk.RustMigrationQualification/debug/SlopHawk.RustMigrationQualification.dll" \
            qualify tests/fixtures/native-engine/missing-scope.json "$RUNNER_TEMP/receipt.json" "$RUNNER_TEMP/analysis.json" || status=$?
          test "$status" -eq 1
          test -f "$RUNNER_TEMP/analysis.json"

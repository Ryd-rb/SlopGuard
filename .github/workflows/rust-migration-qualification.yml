name: Rust release qualification

on:
  workflow_dispatch:
  push:
    branches: [main, voda-linux-validation]

permissions:
  contents: read

jobs:
  language-exchanges:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.404
      - name: Start an authenticated systemd user manager
        shell: bash
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          test -f /sys/fs/cgroup/cgroup.controllers
          for attempt in $(seq 1 20); do
            if systemctl --user show-environment >/dev/null 2>&1; then break; fi
            sleep 1
          done
          systemctl --user show-environment >/dev/null
          systemd-run --user --wait --quiet --pipe -- /usr/bin/true
      - name: Build pinned Rust workers
        id: workers
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/voda-target"
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 build --locked --manifest-path rust/project-context/fluxr/Cargo.toml
          cargo +1.99.1 test --locked --manifest-path rust/workers/language-execution/Cargo.toml --no-run
          cargo +1.99.1 test --locked --manifest-path rust/native-coordinator/Cargo.toml --no-run
          echo "VODA_FLUXR_WORKER_BIN=$CARGO_TARGET_DIR/debug/slophawk-fluxr-checked-worker" >> "$GITHUB_ENV"
          echo "VODA_CARGO_BIN=$(rustup which --toolchain 1.99.1 cargo)" >> "$GITHUB_ENV"
          echo "VODA_RUSTC_BIN=$(rustup which --toolchain 1.99.1 rustc)" >> "$GITHUB_ENV"
          echo "VODA_RUSTDOC_BIN=$(rustup which --toolchain 1.99.1 rustdoc)" >> "$GITHUB_ENV"
      - name: Prepare pinned pytest and report plugin
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv --copies "$RUNNER_TEMP/voda-python"
          py="$RUNNER_TEMP/voda-python/bin/python3"
          mkdir "$RUNNER_TEMP/voda-wheelhouse"
          "$py" -m pip download --only-binary=:all: --dest "$RUNNER_TEMP/voda-wheelhouse" pytest==9.0.2 pytest-json-report==1.5.0 pytest-metadata==3.1.1
          "$py" -m pip install --no-index --find-links "$RUNNER_TEMP/voda-wheelhouse" pytest==9.0.2 pytest-json-report==1.5.0 pytest-metadata==3.1.1
          echo "VODA_PYTHON_BIN=$py" >> "$GITHUB_ENV"
          echo "VODA_PYTEST_SHA256=$(sha256sum "$RUNNER_TEMP"/voda-wheelhouse/pytest-*.whl | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          echo "VODA_PLUGIN_SHA256=$(sha256sum "$RUNNER_TEMP"/voda-wheelhouse/pytest_json_report-*.whl | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          echo "VODA_EFFECTIVE_PYTEST_CONFIG_SHA256=$(printf '%s' 'pytest-9.0.2;pytest-json-report-1.5.0;fixture-testpaths=tests;autoload=off' | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Run real language worker exchanges
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_NET_OFFLINE=true
          export SLOPHAWK_SCOPE_DIAGNOSTICS=1
          cargo +1.99.1 test --locked --offline --manifest-path rust/runtime/worker-scope/Cargo.toml
          cargo +1.99.1 test --locked --offline --manifest-path rust/workers/language-execution/Cargo.toml
          cargo +1.99.1 test --locked --offline --manifest-path rust/workers/language-execution/Cargo.toml --test real_workers -- --ignored --nocapture --test-threads=1
      - name: Run the native executable-test scheduler against real workers
        id: executable-scheduler
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/native-executable-scheduler.log") 2>&1
          export VODA_LANGUAGE_WORKER_BIN="$CARGO_TARGET_DIR/debug/slophawk-language-worker"
          artifacts="$RUNNER_TEMP/voda-dotnet"
          dotnet build src/SlopHawk.Providers.CSharp.ExecutionWorker/SlopHawk.Providers.CSharp.ExecutionWorker.csproj --artifacts-path "$artifacts"
          installed_sdk="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          private_sdk="$RUNNER_TEMP/voda-csharp-sdk"
          mkdir -m 700 "$private_sdk"
          mkdir -m 700 "$private_sdk/sdk"
          cp -L "$installed_sdk/dotnet" "$private_sdk/dotnet"
          cp -RL "$installed_sdk/sdk/10.0.404" "$private_sdk/sdk/10.0.404"
          cp -RL "$installed_sdk/host" "$installed_sdk/shared" "$installed_sdk/packs" "$private_sdk/"
          chmod -R go-w "$private_sdk"
          export VODA_CSHARP_DOTNET="$private_sdk/dotnet"
          export VODA_CSHARP_SDK=10.0.404
          export VODA_CSHARP_PEER="$artifacts/bin/SlopHawk.Providers.CSharp.ExecutionWorker/debug/SlopHawk.Providers.CSharp.ExecutionWorker.dll"
          export VODA_SCHEDULER_EVIDENCE="$RUNNER_TEMP/native-executable-receipts.json"
          export VODA_SCHEDULER_FIXTURE_MANIFEST="$RUNNER_TEMP/native-scheduler-workspace.json"
          cargo +1.99.1 test --locked --manifest-path rust/frontends/public-shell/Cargo.toml --bin slophawk resident_scheduler_runs_registered_providers_and_recovers_receipts -- --ignored --nocapture
      - name: Retain executable-test scheduler receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: linux-executable-test-receipts
          path: |
            ${{ runner.temp }}/native-executable-receipts.json
            ${{ runner.temp }}/native-executable-scheduler.log
          if-no-files-found: ignore
      - name: Exercise the coordinator and recover an interrupted live worker
        shell: bash
        run: |
          set -euo pipefail
          export SLOPHAWK_LIVE_NATIVE_SCOPE=1
          cargo +1.99.1 test --locked --offline --manifest-path rust/native-coordinator/Cargo.toml -- --test-threads=1
      - name: Run the four-language checker suite with an actual Roslyn worker
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/voda-dotnet"
          dotnet build src/SlopHawk.Providers.CSharp.Worker/SlopHawk.Providers.CSharp.Worker.csproj --artifacts-path "$artifacts"
          export VARO_DOTNET="$(readlink -f "$(command -v dotnet)")"
          export VARO_WORKER_DLL="$artifacts/bin/SlopHawk.Providers.CSharp.Worker/debug/SlopHawk.Providers.CSharp.Worker.dll"
          export VARO_REFERENCE_PACK="$(dirname "$VARO_DOTNET")/packs/Microsoft.NETCore.App.Ref/10.0.0/ref/net10.0"
          if ! test -f "$VARO_REFERENCE_PACK/System.Runtime.dll"; then
            export VARO_REFERENCE_PACK="$(find "$(dirname "$VARO_DOTNET")/packs/Microsoft.NETCore.App.Ref" -path '*/ref/net10.0' -type d | sort -V | tail -n 1)"
          fi
          test -f "$VARO_REFERENCE_PACK/System.Runtime.dll"
          export VARO_REQUIRE_REAL_WORKER=1 VODA_TEST_SYSTEMD_SCOPE=1
          cargo +1.99.1 test --locked --manifest-path rust/native-checks/Cargo.toml -- --test-threads=1
      - name: Run the Rust application, MCP, state import and foreground routes
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/slophawk-linux-release.log") 2>&1
          artifacts="$RUNNER_TEMP/voda-dotnet"
          export VARO_DOTNET="$(readlink -f "$(command -v dotnet)")"
          export VARO_WORKER_DLL="$artifacts/bin/SlopHawk.Providers.CSharp.Worker/debug/SlopHawk.Providers.CSharp.Worker.dll"
          export VARO_REFERENCE_PACK="$(find "$(dirname "$VARO_DOTNET")/packs/Microsoft.NETCore.App.Ref" -path '*/ref/net10.0' -type d | sort -V | tail -n 1)"
          export VARO_REQUIRE_REAL_WORKER=1
          # The daemon hashes its executable under a 128 MiB limit. Keep source backtraces without full DWARF.
          CARGO_PROFILE_DEV_DEBUG=line-tables-only cargo +1.99.1 test --locked --manifest-path rust/frontends/public-shell/Cargo.toml -- --test-threads=1
          cargo +1.99.1 build --release --locked --manifest-path rust/frontends/public-shell/Cargo.toml
          dotnet build SlopHawk.slnx --artifacts-path "$artifacts"
          export SLOPHAWK_NATIVE_MIGRATION_BINARY="$CARGO_TARGET_DIR/release/slophawk"
          export SLOPHAWK_NATIVE_SCALAR_WORKER="$artifacts/bin/SlopHawk.Providers.CSharp.ScalarWorker/debug/SlopHawk.Providers.CSharp.ScalarWorker.dll"
          export VODA_SCHEDULER_FIXTURE_MANIFEST="$RUNNER_TEMP/native-scheduler-workspace.json"
          export VODA_NATIVE_PROVIDER_RECEIPTS="$RUNNER_TEMP/native-executable-receipts.json"
          export SLOPHAWK_PROJECT_TEST_DOTNET="$(readlink -f "$(command -v dotnet)")"
          dotnet test SlopHawk.slnx --no-build --artifacts-path "$artifacts" --logger 'console;verbosity=normal' -- xUnit.MaxParallelThreads=2
      - name: Retain application and state transfer evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: linux-rust-release
          path: ${{ runner.temp }}/slophawk-linux-release.log
          if-no-files-found: ignore
      - name: Measure the installed Rust process trees
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/voda-dotnet"
          dotnet build tools/SlopHawk.RustMigrationQualification/SlopHawk.RustMigrationQualification.csproj -c Release --artifacts-path "$artifacts"
          tool="$artifacts/bin/SlopHawk.RustMigrationQualification/release/SlopHawk.RustMigrationQualification"
          "$tool" benchmark-rust-checker "$CARGO_TARGET_DIR/release/slophawk" "$artifacts/bin/SlopHawk.WorkerFixture/debug/SlopHawk.WorkerFixture.dll" "$RUNNER_TEMP/rust-checker"
          "$tool" benchmark-rust "$CARGO_TARGET_DIR/release/slophawk" "$RUNNER_TEMP/rust-resident"
      - name: Retain Rust process-tree measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: linux-rust-process-trees
          path: |
            ${{ runner.temp }}/rust-checker/*.json
            ${{ runner.temp }}/rust-resident/*.json
          if-no-files-found: ignore

  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.404
      - name: Validate the installed Rust CLI, MCP and C# workers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Check { if ($LASTEXITCODE -ne 0) { throw "Failed with exit code $LASTEXITCODE" } }
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'slophawk-target'
          $artifacts = Join-Path $env:RUNNER_TEMP 'slophawk-dotnet'
          rustup toolchain install 1.99.1 --profile minimal
          Check
          cargo +1.99.1 build --release --locked --manifest-path rust/frontends/public-shell/Cargo.toml
          Check
          dotnet build SlopHawk.slnx --artifacts-path $artifacts
          Check
          $env:SLOPHAWK_NATIVE_MIGRATION_BINARY = Join-Path $env:CARGO_TARGET_DIR 'release/slophawk.exe'
          $env:SLOPHAWK_NATIVE_SCALAR_WORKER = Join-Path $artifacts 'bin/SlopHawk.Providers.CSharp.ScalarWorker/debug/SlopHawk.Providers.CSharp.ScalarWorker.dll'
          $env:VARO_DOTNET = (Get-Command dotnet).Source
          $env:VARO_WORKER_DLL = Join-Path $artifacts 'bin/SlopHawk.Providers.CSharp.Worker/debug/SlopHawk.Providers.CSharp.Worker.dll'
          $ref = Get-ChildItem (Join-Path (Split-Path $env:VARO_DOTNET) 'packs/Microsoft.NETCore.App.Ref') -Directory |
              Where-Object { $_.Name -like '10.*' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $env:VARO_REFERENCE_PACK = Join-Path $ref.FullName 'ref/net10.0'
          $env:VARO_REQUIRE_REAL_WORKER = '1'
          cargo +1.99.1 test --locked --manifest-path rust/frontends/public-shell/Cargo.toml -- --test-threads=1
          Check
          cargo +1.99.1 test --locked --manifest-path rust/native-checks/Cargo.toml -- --test-threads=1
          Check
          cargo +1.99.1 test --locked --manifest-path rust/runtime/worker-scope/Cargo.toml -- --test-threads=1
          Check
          dotnet test SlopHawk.slnx --no-build --artifacts-path $artifacts --logger 'console;verbosity=normal' -- xUnit.MaxParallelThreads=2
          Check
      - name: Measure the installed Rust process trees
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Check { if ($LASTEXITCODE -ne 0) { throw "Failed with exit code $LASTEXITCODE" } }
          $artifacts = Join-Path $env:RUNNER_TEMP 'slophawk-dotnet'
          $binary = Join-Path $env:RUNNER_TEMP 'slophawk-target/release/slophawk.exe'
          dotnet build tools/SlopHawk.RustMigrationQualification/SlopHawk.RustMigrationQualification.csproj -c Release --artifacts-path $artifacts
          Check
          $tool = Join-Path $artifacts 'bin/SlopHawk.RustMigrationQualification/release/SlopHawk.RustMigrationQualification.exe'
          $adapter = Join-Path $artifacts 'bin/SlopHawk.WorkerFixture/debug/SlopHawk.WorkerFixture.dll'
          & $tool benchmark-rust-checker $binary $adapter (Join-Path $env:RUNNER_TEMP 'rust-checker')
          Check
          & $tool benchmark-rust $binary (Join-Path $env:RUNNER_TEMP 'rust-resident')
          Check
      - name: Retain Rust process-tree measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: windows-rust-process-trees
          path: |
            ${{ runner.temp }}/rust-checker/*.json
            ${{ runner.temp }}/rust-resident/*.json
          if-no-files-found: ignore
